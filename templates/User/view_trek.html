<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Trek</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <h1>Trek Details</h1>

    <hr />

    <p><strong>Trek Name :</strong> {{ trek.name }}</p>

    <p><strong>Location :</strong> {{ trek.location }}</p>

    <p><strong>Description :</strong> {{ trek.description }}</p>

    <p><strong>Duration :</strong> {{ trek.duration }} Days</p>

    <p><strong>Available Slots :</strong> {{ trek.available_slots }}</p>

    <p><strong>Status :</strong> {{ trek.status }}</p>

    <p><strong>Progress :</strong> {{ trek.progress }}</p>

    <br />

    <a href="/book_trek/{{ trek.id }}">Book Trek</a>

    <br /><br />

    <a href="/browse_treks">Back to Browse Treks</a>
  </body>
</html>
