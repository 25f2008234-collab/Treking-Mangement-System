<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Trek - Saarthi</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header>
      <h1>Saarthi</h1>

      <p>Your Trusted Trek Companion</p>
    </header>

    <nav>
      <a href="/admin_dashboard">Dashboard</a>

      <a href="/treks">Manage Treks</a>

      <a href="/logout">Logout</a>
    </nav>

    <div class="container">
      <div class="card">
        <h2>Update Trek</h2>

        <p>Edit the trek information below.</p>

        <form method="POST">
          <label>Trek Name</label>

          <input type="text" name="name" value="{{ trek.name }}" required />

          <label>Location</label>

          <input
            type="text"
            name="location"
            value="{{ trek.location }}"
            required
          />

          <label>Description</label>

          <textarea name="description" required>
{{ trek.description }}</textarea
          >

          <label>Duration (Days)</label>

          <input
            type="number"
            name="duration"
            value="{{ trek.duration }}"
            required
          />

          <br />
          <label>Difficulty</label>

          <select name="difficulty" required>
            <option {% if trek.difficulty="" ="Easy" %}selected{% endif %}>
              Easy
            </option>

            <option {% if trek.difficulty="" ="Moderate" %}selected{% endif %}>
              Moderate
            </option>

            <option {% if trek.difficulty="" ="Hard" %}selected{% endif %}>
              Hard
            </option>
          </select>

          <label>Start Date</label>

          <input
            type="date"
            name="start_date"
            value="{{ trek.start_date }}"
            required
          />

          <label>Available Slots</label>

          <input
            type="number"
            name="available_slots"
            value="{{ trek.available_slots }}"
            min="1"
            required
          />

          <input type="submit" value="Update Trek" />
        </form>

        <br />

        <a href="/treks" class="btn">Back to Manage Treks</a>
      </div>
    </div>

    <footer>
      <p>© 2026 Saarthi | Trekking Management System</p>
    </footer>
  </body>
</html>
