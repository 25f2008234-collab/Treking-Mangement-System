<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Manage Users</h1>
    <table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for user in users %}

    <tr>

        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>

    <td>{{ user.status }}</td>

    <td>

        {% if user.status == "Active" %}

        <a href="/block_user/{{ user.id }}">Block</a>

        {% else %}

        <a href="/unblock_user/{{ user.id }}">Unblock</a>

        {% endif %}

    </td>

</tr>

    {% endfor %}

</table>

<br>

<a href="/admin_dashboard">Back</a>

</body>
</html>
