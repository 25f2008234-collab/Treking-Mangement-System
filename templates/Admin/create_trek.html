<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Trek - Saarthi</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header>

        <h1>Saarthi</h1>

        <p>Your Trusted Trek Companion</p>

    </header>

    <nav>

        <a href="/admin_dashboard">Dashboard</a>

        <a href="/treks">Manage Treks</a>

        <a href="/logout">Logout</a>

    </nav>

    <div class="container">

        <div class="card">

            <h2>Create New Trek</h2>

            <p>Enter the details below to add a new trek.</p>

            <form action="/create_trek" method="POST">

                <label>Trek Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter trek name"
                    required>

                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="Enter trek location"
                    required>

                <label>Description</label>

                <textarea
                    name="description"
                    placeholder="Write a short description"
                    required></textarea>

                <label>Duration (Days)</label>

                <input
                    type="number"
                    name="duration"
                    placeholder="Enter duration"
                    required>

                <br>

                <input type="submit" value="Create Trek">

            </form>

            <br>

            <a href="/treks" class="btn">Back to Manage Treks</a>

        </div>

    </div>

    <footer>

        <p>© 2026 Saarthi | Trekking Management System</p>

    </footer>

</body>

</html>
