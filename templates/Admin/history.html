<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History</title>
</head>
<body>
    <h1>My Trekking History</h1>
    <table border="1">
        <tr>
            <th>Trek</th>
            <th>Date</th>
        </tr>
        {% for booking in bookings %}
        <tr>
            <td>{{ booking.trek.name }}</td>
            <td>{{ booking.booking_date }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/user">Back</a>
</body>
</html>
