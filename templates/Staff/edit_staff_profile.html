<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Profile - Saarthi</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header>
      <h1>Saarthi</h1>

      <p>Your Trusted Trek Companion</p>
    </header>

    <nav>
      <a href="/staff_dashboard">Dashboard</a>

      <a href="/my_treks">My Treks</a>

      <a href="/participants">Participants</a>

      <a href="/logout">Logout</a>
    </nav>

    <div class="container">
      <div class="card">
        <h2>Edit Staff Profile</h2>

        <p>Update your profile information.</p>

        <form method="POST">
          <label>Name</label>

          <input type="text" name="name" value="{{ staff.name }}" required />

          <label>Role</label>

          <input type="text" name="role" value="{{ staff.role }}" required />

          <input type="submit" value="Update Profile" />
        </form>

        <br />

        <a href="/staff_dashboard" class="btn"> Back to Dashboard </a>
      </div>
    </div>

    <footer>
      <p>© 2026 Saarthi | Trekking Management System</p>
    </footer>
  </body>
</html>
