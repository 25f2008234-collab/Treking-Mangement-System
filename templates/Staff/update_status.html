<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trek Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Update Trek Status</h1>
    <form method="POST">
        <p><b>{{ trek.name }}</b></p>
        <label>Status</label>
        <select name="status">
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
        </select>
        <br><br>
        <button type="submit">Update</button>
    </form>
    <br>
    <a href="/my_treks">Back</a>
</body>
</html>
