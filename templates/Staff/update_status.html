<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Status - Saarthi</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <header>
      <h1>Saarthi</h1>

      <p>Your Trusted Trek Companion</p>
    </header>

    <nav>
      <a href="/staff_dashboard">Dashboard</a>

      <a href="/my_treks">My Treks</a>

      <a href="/participants">Participants</a>

      <a href="/logout">Logout</a>
    </nav>

    <div class="container">
      <div class="card">
        <h2>Update Trek Status</h2>

        <p><strong>Trek:</strong> {{ trek.name }}</p>

        <form method="POST">
          <label>Status</label>

          <select name="status">
            <option value="Open">Open</option>

            <option value="Closed">Closed</option>
          </select>

          <input type="submit" value="Update Status" />
        </form>

        <br />

        <a href="/my_treks" class="btn"> Back to My Treks </a>
      </div>
    </div>

    <footer>
      <p>© 2026 Saarthi | Trekking Management System</p>
    </footer>
  </body>
</html>
